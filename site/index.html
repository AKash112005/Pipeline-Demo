<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Production App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🚀 DevOps Production Application</h1>

        <div class="card">
            <h2>Current Time</h2>
            <p id="time"></p>
        </div>

        <div class="card">
            <h2>Click Counter</h2>
            <button onclick="increment()">Click Me</button>
            <p>Count: <span id="count">0</span></p>
        </div>

        <div class="card">
            <h2>API Simulation</h2>
            <button onclick="fetchData()">Fetch Data</button>
            <p id="api-result"></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
